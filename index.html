<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alkaff Fragrances - Kasir</title>
  <style>
    :root {
      --bg: #f4f8f7;
      --card: #ffffff;
      --ink: #12312c;
      --muted: #5a726d;
      --line: #dfe9e6;
      --primary: #0f5d54;
      --primary-soft: #e7f3f0;
      --wa: #1a9e4f;
      --danger: #b74137;
      --warning: #f4b942;
      --shadow: 0 10px 30px rgba(17, 43, 36, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      background: var(--primary);
      color: white;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      box-shadow: var(--shadow);
      gap: 12px;
    }
    .brand {
      background: transparent;
      color: white;
      border: none;
      border-bottom: 1px dashed rgba(255,255,255,0.7);
      font-size: 1.05rem;
      font-weight: 700;
      padding: 4px 0;
      min-width: 220px;
      max-width: 260px;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    nav button {
      background: transparent;
      border: 0;
      color: inherit;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      opacity: 0.8;
    }
    nav button[aria-selected="true"] {
      background: rgba(255,255,255,0.18);
      opacity: 1;
    }
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 14px 30px;
    }
    .view { display: none; }
    .view.on { display: block; }
    .layout {
      display: grid;
      grid-template-columns: 1.35fr 0.8fr;
      gap: 18px;
      align-items: start;
    }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
    }
    .box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    h2 {
      margin: 0 0 12px;
      font-size: 1rem;
    }
    .search, .field, .phone, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fafdfc;
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--ink);
      font: inherit;
    }
    .field, .phone, select {
      min-height: 42px;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
    }
    .row input {
      width: 132px;
      text-align: right;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .item {
      text-align: left;
      background: var(--primary-soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 10px;
      cursor: pointer;
      color: var(--ink);
      min-height: 80px;
    }
    .item b { display: block; margin-bottom: 4px; }
    .item span { display: block; font-size: 0.75rem; color: var(--muted); }
    .item:disabled { opacity: 0.45; cursor: not-allowed; }
    .line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .line .n { flex: 1; min-width: 0; }
    .line small { display: block; color: var(--muted); }
    .q {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .q button {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid var(--line); background: white; cursor: pointer;
      font-size: 1rem; font-weight: 700;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: var(--primary);
      color: white;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .btn.ghost { background: var(--primary-soft); color: var(--ink); }
    .btn.wa { background: var(--wa); }
    .btn.full { width: 100%; }
    .btn.sm { padding: 8px 10px; font-size: 0.85rem; }
    .muted { color: var(--muted); font-size: 0.81rem; }
    .err {
      min-height: 18px;
      color: var(--danger);
      font-size: 0.8rem;
      margin: 8px 0 0;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat {
      background: var(--primary-soft);
      border-radius: 12px;
      padding: 12px;
    }
    .stat span { display: block; color: var(--muted); font-size: 0.75rem; }
    .stat b { font-size: 1.2rem; }
    .seg {
      display: flex;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      margin: 10px 0;
    }
    .seg button {
      flex: 1;
      border: none;
      background: white;
      padding: 9px 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .seg button[aria-pressed="true"] {
      background: var(--primary);
      color: white;
    }
    .hide { display: none !important; }
    .lock-screen {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0f5d54 0%, #183f3a 100%);
      z-index: 30;
    }
    .lock-box {
      background: white; border-radius: 18px; width: min(360px, calc(100vw - 26px));
      padding: 22px 20px; box-shadow: var(--shadow);
    }
    .lock-box h1 {
      margin: 0 0 8px; font-size: 1.3rem; text-align: center; color: var(--ink);
    }
    .lock-box p {
      margin: 0 0 12px; text-align: center; color: var(--muted);
    }
    .lock-box input {
      width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 13px 12px;
      text-align: center; font-size: 1.1rem; letter-spacing: 0.24rem; margin-bottom: 8px;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    .x {
      border: none; background: transparent; color: var(--danger); font-weight: 700; cursor: pointer;
    }
    pre {
      background: #f7f9f9; border: 1px dashed var(--line); border-radius: 10px; padding: 12px; white-space: pre-wrap; overflow: auto; max-height: 40vh;
    }
    @media (max-width: 560px) {
      header { padding: 12px 12px; }
      nav { width: 100%; }
      nav button { flex: 1 1 30%; }
      .brand { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <input id="storeName" class="brand" value="Alkaff Fragrances" aria-label="Nama toko" />
    <nav>
      <button role="tab" data-tab="kasir" aria-selected="true">Kasir</button>
      <button role="tab" data-tab="produk" aria-selected="false">Produk</button>
      <button role="tab" data-tab="riwayat" aria-selected="false">Riwayat</button>
      <button role="tab" data-tab="member" aria-selected="false">Member</button>
      <button role="tab" data-tab="laporan" aria-selected="false">Laporan</button>
    </nav>
    <button id="lockBtn" class="btn ghost sm">Kunci</button>
  </header>

  <main id="app" class="hide">
    <section id="kasir" class="view on">
      <div class="layout">
        <div class="box">
          <input id="q" class="search" placeholder="Cari nama atau kode barang" aria-label="Cari produk" />
          <div id="grid" class="grid"></div>
        </div>
        <div class="box">
          <h2>Pesanan</h2>
          <div id="cart"></div>
          <div class="row"><span>Subtotal</span><b id="sub">Rp0</b></div>
          <div class="row"><label for="disc">Diskon</label><input id="disc" class="field" type="number" min="0" placeholder="0" /></div>
          <div class="row"><span>Total</span><b id="tot">Rp0</b></div>

          <div class="seg" id="payType">
            <button data-type="Tunai" aria-pressed="true">Tunai</button>
            <button data-type="QRIS" aria-pressed="false">QRIS</button>
            <button data-type="Transfer" aria-pressed="false">Transfer</button>
          </div>

          <div id="cashRow" class="row"><label for="cashIn">Uang diterima</label><input id="cashIn" class="field" type="number" min="0" placeholder="0" /></div>

          <div id="memberBox" style="margin-top: 10px;">
            <input id="memberSearch" class="search" placeholder="Cari member" aria-label="Cari member" />
            <div id="memberSug"></div>
            <div id="memberChip" class="hide"></div>
          </div>

          <div class="err" id="err" role="alert"></div>
          <button id="payBtn" class="btn full" style="margin-top: 12px;">Bayar</button>
          <button id="clearBtn" class="btn ghost full" style="margin-top: 8px;">Kosongkan</button>
        </div>
      </div>
    </section>

    <section id="produk" class="view">
      <div class="box">
        <h2>Tambah produk</h2>
        <div class="row" style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
          <input id="prodCode" class="field" placeholder="Kode barang" style="flex:1 1 130px;" />
          <input id="prodName" class="field" placeholder="Nama produk" style="flex:2 1 180px;" />
          <input id="prodCost" class="field" type="number" min="0" placeholder="Harga modal" style="flex:1 1 120px;" />
          <input id="prodPrice" class="field" type="number" min="0" placeholder="Harga jual" style="flex:1 1 120px;" />
          <button id="addProdBtn" class="btn">Simpan</button>
        </div>
        <div id="prodMsg" class="err"></div>
        <h2 style="margin-top: 18px;">Daftar produk</h2>
        <div id="prodList"></div>
      </div>
    </section>

    <section id="riwayat" class="view">
      <div class="box">
        <h2>Riwayat transaksi</h2>
        <div id="historyList"></div>
      </div>
    </section>

    <section id="member" class="view">
      <div class="box">
        <h2>Tambah member</h2>
        <div class="row" style="display:flex; flex-wrap:wrap; gap:8px; align-items:center;">
          <input id="memberName" class="field" placeholder="Nama member" style="flex:2 1 200px;" />
          <input id="memberPhone" class="field" placeholder="Nomor WhatsApp" style="flex:1 1 160px;" />
          <button id="saveMemberBtn" class="btn">Simpan</button>
        </div>
        <div id="memberMsg" class="err"></div>
        <h2 style="margin-top:18px;">Daftar member</h2>
        <input id="memberListSearch" class="search" placeholder="Cari member" />
        <div id="memberList"></div>
      </div>
    </section>

    <section id="laporan" class="view">
      <div class="box">
        <div class="row" style="display:flex; flex-wrap:wrap; align-items:center; gap:8px;">
          <label for="reportDate" class="muted" style="font-weight:700;">Tanggal</label>
          <input id="reportDate" class="field" type="date" style="max-width:220px;" />
          <button id="todayBtn" class="btn ghost">Hari ini</button>
        </div>
        <div id="stats" class="stats" style="margin-top:12px;"></div>
      </div>
    </section>
  </main>

  <div id="lockScreen" class="lock-screen">
    <div class="lock-box">
      <h1>Alkaff Fragrances</h1>
      <p id="lockMessage">Masukkan PIN untuk membuka kasir</p>
      <input id="pinInput" type="password" inputmode="numeric" maxlength="12" autocomplete="off" />
      <div id="lockErr" class="err"></div>
      <button id="unlockBtn" class="btn full">Buka</button>
    </div>
  </div>

  <dialog id="receiptDlg">
    <h2>Struk siap dikirim</h2>
    <pre id="receiptText"></pre>
    <label for="custPhone">Nomor WhatsApp</label>
    <input id="custPhone" class="phone" placeholder="08123456789" />
    <a id="waLink" class="btn wa full" style="margin-top: 10px;" target="_blank" rel="noopener">Kirim via WhatsApp</a>
    <button id="copyBtn" class="btn ghost full" style="margin-top: 8px;">Salin struk</button>
    <button id="doneBtn" class="btn full" style="margin-top: 10px;">Selesai</button>
  </dialog>

  <script>
    const app = (() => {
      const $ = (sel) => document.querySelector(sel);
      const formatRp = (n) => 'Rp' + Math.round(Number(n || 0)).toLocaleString('id-ID');
      const safeText = (v) => (v === null || v === undefined ? '' : String(v).trim());
      const safeNum = (v) => {
        const s = String(v ?? '').replace(/[^\d.-]/g, '');
        if (!s || s === '-' || s === '.') return 0;
        const n = Number(s);
        return Number.isFinite(n) ? n : 0;
      };

      const defaultData = {
        store: 'Alkaff Fragrances',
        products: [
          { id: 1, code: 'P001', name: 'Parfum A', cost: 850000, price: 1200000, stock: 0 },
          { id: 2, code: 'P002', name: 'Parfum B', cost: 400000, price: 650000, stock: 0 },
          { id: 3, code: 'P003', name: 'Parfum C', cost: 60000, price: 100000, stock: 0 }
        ],
        history: [],
        members: [],
        seq: 1,
        pid: 10
      };

      let state = { ...defaultData };
      let cart = {};
      let currentMember = null;
      let paymentType = 'Tunai';
      let ownerHash = '';
      let lockSalt = '';
      let appLocked = true;

      function loadState() {
        try {
          const raw = localStorage.getItem('alkaff_kasir_v1');
          if (raw) state = { ...defaultData, ...JSON.parse(raw) };
          if (!Array.isArray(state.products)) state.products = defaultData.products;
          if (!Array.isArray(state.history)) state.history = [];
          if (!Array.isArray(state.members)) state.members = [];
        } catch (e) {
          state = { ...defaultData };
        }

        try {
          const sec = localStorage.getItem('alkaff_kasir_sec');
          if (sec) {
            const s = JSON.parse(sec);
            ownerHash = s.ownerHash || '';
            lockSalt = s.lockSalt || '';
          }
        } catch (e) {
          ownerHash = '';
          lockSalt = '';
        }

        if (!lockSalt) lockSalt = Math.random().toString(36).slice(2, 12);
      }

      function saveState() {
        localStorage.setItem('alkaff_kasir_v1', JSON.stringify(state));
      }

      function saveSecurity() {
        localStorage.setItem('alkaff_kasir_sec', JSON.stringify({ ownerHash, lockSalt }));
      }

      async function hashPin(pin) {
        const text = lockSalt + ':' + pin;
        try {
          const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
          return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {
          let h = 2166136261 >>> 0;
          for (let i = 0; i < text.length; i++) {
            h ^= text.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return (h >>> 0).toString(16);
        }
      }

      function renderGrid() {
        const q = $('#q').value.toLowerCase();
        let html = '';
        state.products.filter((p) => {
          const hay = (p.name + ' ' + p.code).toLowerCase();
          return hay.includes(q);
        }).forEach((p) => {
          const qty = cart[p.id] || 0;
          html += '<button class="item" data-id="' + p.id + '" ' + (qty >= (p.stock || 0) ? 'disabled' : '') + '>' +
            '<b>' + escapeHtml(p.name) + '</b>' +
            '<span>' + escapeHtml(p.code) + ' · ' + formatRp(p.price) + '</span>' +
            '<span>Stok ' + (p.stock || 0) + '</span>' +
            '</button>';
        });
        $('#grid').innerHTML = html || '<div class="muted">Produk tidak ditemukan.</div>';
      }

      function renderCart() {
        let html = '';
        let sub = 0;
        state.products.forEach((p) => {
          const qty = cart[p.id] || 0;
          if (!qty) return;
          sub += (p.price || 0) * qty;
          html += '<div class="line">' +
            '<div class="n"><b>' + escapeHtml(p.name) + '</b><small>' + formatRp(p.price) + ' x ' + qty + '</small></div>' +
            '<div class="q"><button data-change="-' + p.id + '">-</button><b>' + qty + '</b><button data-change="+' + p.id + '">+</button></div>' +
            '</div>';
        });
        $('#cart').innerHTML = html || '<div class="muted">Produk belum dipilih.</div>';
        const disc = Math.min(safeNum($('#disc').value), sub);
        $('#sub').textContent = formatRp(sub);
        $('#tot').textContent = formatRp(sub - disc);
      }

      function renderHistory() {
        const html = state.history.slice().reverse().map(tx => {
          return '<div class="line">' +
            '<div class="n"><b>' + escapeHtml(tx.no) + '</b><small>' + escapeHtml(tx.date) + '</small></div>' +
            '<div class="q"><b>' + formatRp(tx.total) + '</b><button class="btn ghost sm" data-receipt="' + tx.no + '">Buka</button></div>' +
            '</div>';
        }).join('');
        $('#historyList').innerHTML = html || '<div class="muted">Belum ada transaksi.</div>';
      }

      function renderProducts() {
        const html = state.products.map((p) => {
          return '<div class="line">' +
            '<div class="n"><b>' + escapeHtml(p.name) + '</b><small>Kode ' + escapeHtml(p.code) + ' · Jual ' + formatRp(p.price) + ' · Modal ' + formatRp(p.cost) + '</small></div>' +
            '<button class="x" data-del-product="' + p.id + '">Hapus</button>' +
            '</div>';
        }).join('');
        $('#prodList').innerHTML = html || '<div class="muted">Belum ada produk.</div>';
      }

      function renderMembers() {
        const q = $('#memberListSearch').value.toLowerCase();
        const list = state.members.filter(m => (m.name + ' ' + m.phone).toLowerCase().includes(q));
        const html = list.map(m => '<div class="line"><div class="n"><b>' + escapeHtml(m.name) + '</b><small>' + escapeHtml(m.phone) + '</small></div></div>').join('');
        $('#memberList').innerHTML = html || '<div class="muted">Belum ada member.</div>';
      }

      function renderReport() {
        const d = $('#reportDate').value || new Date().toISOString().slice(0, 10);
        let total = 0; let count = 0;
        state.history.forEach(tx => {
          if (tx.date.startsWith(d)) {
            total += Number(tx.total || 0);
            count++;
          }
        });
        $('#stats').innerHTML = '<div class="stat"><span>Penjualan</span><b>' + formatRp(total) + '</b></div><div class="stat"><span>Transaksi</span><b>' + count + '</b></div>';
      }

      function openReceipt(no) {
        const tx = state.history.find((x) => x.no === no);
        if (!tx) return;
        const lines = [
          '*' + state.store.toUpperCase() + '*',
          tx.no,
          tx.date,
          '--------------------------',
        ];
        tx.items.forEach((i) => {
          lines.push(i.qty + 'x ' + i.name);
          lines.push('   @' + formatRp(i.price) + ' = ' + formatRp(i.qty * i.price));
        });
        lines.push('--------------------------');
        lines.push('Subtotal: ' + formatRp(tx.sub));
        if (tx.disc > 0) lines.push('Diskon: -' + formatRp(tx.disc));
        lines.push('*Total: ' + formatRp(tx.total) + '*');
        lines.push('');
        $('#receiptText').textContent = lines.join('\n');
        $('#custPhone').value = tx.phone || '';
        updateWA();
        $('#receiptDlg').showModal();
      }

      function updateWA() {
        const raw = $('#custPhone').value.replace(/\D/g, '');
        let wa = raw;
        if (wa.startsWith('0')) wa = '62' + wa.slice(1);
        const valid = /^62\d{9,13}$/.test(wa);
        const link = $('#waLink');
        if (valid) {
          link.href = 'https://wa.me/' + wa + '?text=' + encodeURIComponent($('#receiptText').textContent);
          link.style.opacity = '1';
        } else {
          link.href = '#';
          link.style.opacity = '0.5';
        }
      }

      function addProduct() {
        const code = $('#prodCode').value.trim();
        const name = $('#prodName').value.trim();
        const cost = safeNum($('#prodCost').value);
        const price = safeNum($('#prodPrice').value);
        if (!name || !price) {
          $('#prodMsg').textContent = 'Nama dan harga jual wajib diisi.';
          return;
        }
        const newProduct = {
          id: state.pid++,
          code: code || 'P' + String(state.pid).padStart(3, '0'),
          name,
          cost,
          price,
          stock: 0
        };
        state.products.push(newProduct);
        saveState();
        renderGrid();
        renderProducts();
        $('#prodCode').value = '';
        $('#prodName').value = '';
        $('#prodCost').value = '';
        $('#prodPrice').value = '';
        $('#prodMsg').textContent = '';
      }

      function addMember() {
        const name = $('#memberName').value.trim();
        const phone = $('#memberPhone').value.replace(/\D/g, '');
        if (!name || !phone) {
          $('#memberMsg').textContent = 'Nama dan nomor wajib diisi.';
          return;
        }
        state.members.push({ name, phone });
        saveState();
        renderMembers();
        $('#memberName').value = '';
        $('#memberPhone').value = '';
        $('#memberMsg').textContent = '';
      }

      function suggestMembers() {
        const q = $('#memberSearch').value.toLowerCase();
        if (!q) {
          $('#memberSug').innerHTML = '';
          return;
        }
        const list = state.members.filter(m => (m.name + ' ' + m.phone).toLowerCase().includes(q)).slice(0, 5);
        $('#memberSug').innerHTML = list.map(m => '<div class="line" data-pick-member="' + m.phone + '"><div class="n"><b>' + escapeHtml(m.name) + '</b><small>' + escapeHtml(m.phone) + '</small></div></div>').join('');
      }

      function setMemberByPhone(phone) {
        const member = state.members.find(m => m.phone === phone);
        if (!member) return;
        currentMember = member;
        $('#memberChip').innerHTML = '<div class="line"><div class="n"><b>' + escapeHtml(member.name) + '</b><small>' + escapeHtml(member.phone) + '</small></div><button class="x" id="clearMember">X</button></div>';
        $('#memberChip').classList.remove('hide');
        $('#memberSearch').value = '';
        $('#memberSug').innerHTML = '';
      }

      function pay() {
        const entries = Object.entries(cart);
        if (!entries.length) {
          $('#err').textContent = 'Pesanan masih kosong.';
          return;
        }
        let sub = 0;
        const items = entries.map(([id, qty]) => {
          const p = state.products.find(x => String(x.id) === String(id));
          if (!p) return null;
          sub += Number(p.price) * Number(qty);
          return { id: p.id, name: p.name, code: p.code, price: p.price, qty: Number(qty) };
        }).filter(Boolean);

        const disc = Math.min(safeNum($('#disc').value), sub);
        const total = sub - disc;
        const cashIn = paymentType === 'Tunai' ? safeNum($('#cashIn').value) : total;
        if (cashIn < total) {
          $('#err').textContent = 'Uang diterima kurang ' + formatRp(total - cashIn) + '.';
          return;
        }

        const tx = {
          no: 'INV-' + String(state.seq++).padStart(4, '0'),
          total,
          sub,
          disc,
          cash: cashIn,
          date: new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }),
          items,
          method: paymentType,
          phone: currentMember ? currentMember.phone : '',
          store: state.store
        };

        state.history.push(tx);
        items.forEach(item => {
          const p = state.products.find(x => x.id === item.id);
          if (p) p.stock = Math.max(0, (p.stock || 0) - item.qty);
        });
        saveState();
        renderHistory();
        renderReport();
        renderGrid();
        cart = {};
        $('#disc').value = '';
        $('#cashIn').value = '';
        $('#err').textContent = '';
        renderCart();
        openReceipt(tx.no);
      }

      function escapeHtml(str) {
        return safeText(str).replace(/[&<>"']/g, (chars) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[chars]));
      }

      function bindEvents() {
        $('#q').addEventListener('input', renderGrid);
        $('#disc').addEventListener('input', renderCart);
        $('#grid').addEventListener('click', (e) => {
          const item = e.target.closest('.item');
          if (!item) return;
          const id = item.dataset.id;
          const p = state.products.find(x => String(x.id) === String(id));
          if (!p) return;
          if ((cart[id] || 0) >= (p.stock || 0)) return;
          cart[id] = (cart[id] || 0) + 1;
          renderCart();
        });

        $('#cart').addEventListener('click', (e) => {
          const target = e.target.closest('[data-change]');
          if (!target) return;
          const val = target.dataset.change;
          const sign = val.startsWith('+') ? 1 : -1;
          const id = val.slice(1);
          cart[id] = (cart[id] || 0) + sign;
          if ((cart[id] || 0) <= 0) delete cart[id];
          renderCart();
        });

        $('#payType').addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-type]');
          if (!btn) return;
          paymentType = btn.dataset.type;
          document.querySelectorAll('#payType button').forEach((b) => {
            b.setAttribute('aria-pressed', String(b === btn));
          });
        });

        $('#payBtn').addEventListener('click', pay);
        $('#clearBtn').addEventListener('click', () => { cart = {}; renderCart(); });

        $('#addProdBtn').addEventListener('click', addProduct);
        $('#prodList').addEventListener('click', (e) => {
          const btn = e.target.closest('[data-del-product]');
          if (!btn) return;
          const id = Number(btn.dataset.delProduct);
          state.products = state.products.filter(p => p.id !== id);
          saveState();
          renderProducts();
          renderGrid();
        });

        $('#saveMemberBtn').addEventListener('click', addMember);
        $('#memberListSearch').addEventListener('input', renderMembers);
        $('#memberSearch').addEventListener('input', suggestMembers);
        $('#memberSug').addEventListener('click', (e) => {
          const item = e.target.closest('[data-pick-member]');
          if (!item) return;
          setMemberByPhone(item.dataset.pickMember);
        });
        $('#memberChip').addEventListener('click', (e) => {
          const btn = e.target.closest('#clearMember');
          if (!btn) return;
          currentMember = null;
          $('#memberChip').classList.add('hide');
          $('#memberChip').innerHTML = '';
        });

        $('#historyList').addEventListener('click', (e) => {
          const btn = e.target.closest('[data-receipt]');
          if (!btn) return;
          openReceipt(btn.dataset.receipt);
        });

        $('#receiptDlg').addEventListener('close', () => {
          $('#custPhone').value = '';
        });
        $('#custPhone').addEventListener('input', updateWA);
        $('#waLink').addEventListener('click', (e) => {
          if (!$('#waLink').href || $('#waLink').href === location.href + '#') {
            e.preventDefault();
          }
        });
        $('#copyBtn').addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText($('#receiptText').textContent);
          } catch (e) {}
        });
        $('#doneBtn').addEventListener('click', () => $('#receiptDlg').close());

        $('#lockBtn').addEventListener('click', () => {
          appLocked = true;
          $('#lockScreen').classList.remove('hide');
          $('#pinInput').focus();
        });

        $('#unlockBtn').addEventListener('click', unlock);
        $('#pinInput').addEventListener('keydown', (e) => {
          if (e.key === 'Enter') unlock();
        });

        $('#storeName').addEventListener('input', () => {
          state.store = $('#storeName').value || 'Alkaff Fragrances';
          saveState();
        });

        document.querySelectorAll('nav button[role="tab"]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const tab = btn.dataset.tab;
            document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === tab));
            document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', String(b === btn)));
            if (tab === 'laporan') renderReport();
          });
        });

        $('#reportDate').value = new Date().toISOString().slice(0, 10);
        $('#reportDate').addEventListener('change', renderReport);
        $('#todayBtn').addEventListener('click', () => {
          $('#reportDate').value = new Date().toISOString().slice(0, 10);
          renderReport();
        });
      }

      async function unlock() {
        const pin = $('#pinInput').value.trim();
        if (!/^\d{4,12}$/.test(pin)) {
          $('#lockErr').textContent = 'PIN harus 4 sampai 12 angka.';
          return;
        }
        const hashed = await hashPin(pin);
        const defaultPin = '1234';
        if (!ownerHash) {
          ownerHash = await hashPin(defaultPin);
          saveSecurity();
        }
        if (hashed === ownerHash) {
          appLocked = false;
          $('#lockScreen').classList.add('hide');
          $('#app').classList.remove('hide');
          $('#lockErr').textContent = '';
          $('#pinInput').value = '';
          return;
        }
        $('#lockErr').textContent = 'PIN salah.';
        $('#pinInput').value = '';
      }

      function initialRender() {
        renderGrid();
        renderCart();
        renderHistory();
        renderProducts();
        renderMembers();
        renderReport();
        $('#storeName').value = state.store;
      }

      function init() {
        loadState();
        bindEvents();
        initialRender();
        $('#lockScreen').classList.remove('hide');
        $('#app').classList.add('hide');
      }

      return { init, renderGrid, renderCart, renderHistory, renderProducts, renderMembers, renderReport };
    })();

    app.init();
  </script>
</body>
</html>
