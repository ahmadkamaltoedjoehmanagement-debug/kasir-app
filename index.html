<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alkaff Fragrances - Kasir</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f5;--card:#fff;--ink:#12312c;--mut:#5b716c;--line:#d9e3e0;--pri:#0f5e54;--onpri:#fff;--wa:#1a9e4f;--soft:#e4f0ed;--danger:#b3392f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Plus Jakarta Sans",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--pri);color:var(--onpri)}
header input{background:transparent;border:0;border-bottom:1px dashed currentColor;color:inherit;font-weight:800;font-size:18px;width:min(260px,60vw);padding:2px 0}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:inherit;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;opacity:.75}
nav button[aria-selected=true]{background:rgba(255,255,255,.18);opacity:1}
main{max-width:1080px;margin:0 auto;padding:16px}
.view{display:none}.view.on{display:block}
.pos{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
@media(max-width:800px){.pos{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;min-height:76px;border:none}
.item:hover{background:var(--line)}
.item b{display:block;font-weight:600}.item span{color:var(--mut);font-size:13px}
h2{font-size:16px;margin:0 0 10px}
.line{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.line .n{flex:1;min-width:0}
.line small{color:var(--mut);display:block}
.q{display:flex;align-items:center;gap:6px}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;gap:8px}
.row input{width:130px;text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.total{font-size:22px;font-weight:800;padding-top:8px}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--pri);color:var(--onpri);text-align:center;text-decoration:none}
.btn:hover{opacity:.9}
.btn.wa{background:var(--wa);color:#fff}.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.full{width:100%;margin-top:10px}.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{color:var(--mut);padding:14px 0}
.form{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.form input,.form select{padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);flex:1;min-width:130px}
.x{background:transparent;border:0;color:var(--danger);cursor:pointer;font-weight:600;padding:0}
.scroll{overflow-x:auto}
dialog{border:0;border-radius:14px;padding:18px;max-width:420px;width:calc(100% - 24px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
pre{background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;max-height:42vh;overflow:auto;margin:10px 0}
label{font-weight:600;font-size:13px}
.phone{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-top:4px}
.err{color:var(--danger);font-size:13px;min-height:18px}
.item span{display:block}.item:disabled{opacity:.45;cursor:not-allowed}
.item .low,.low{color:var(--danger);font-weight:600}
.ra{width:72px;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);text-align:right}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:6px}
.seg button{border:0;background:var(--card);padding:9px 16px;cursor:pointer;font-weight:600}
.seg button[aria-pressed=true]{background:var(--pri);color:var(--onpri)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0 18px}
.stat{background:var(--soft);border-radius:10px;padding:12px}.stat span{display:block;color:var(--mut);font-size:13px}.stat b{font-size:20px}
#lock{position:fixed;inset:0;z-index:50;background:var(--pri);display:flex;align-items:center;justify-content:center;padding:20px}
#lock[hidden]{display:none}
.lk{background:var(--card);border-radius:14px;padding:22px;width:min(340px,100%)}
.lk h1{margin:0 0 6px;font-size:20px}.lk p{margin:0 0 12px;line-height:1.4}
.lk input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:8px;font-size:18px;letter-spacing:4px;text-align:center}
.lkb{background:rgba(255,255,255,.18);border:0;color:inherit;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
[hidden]{display:none!important}
#paym{display:flex;width:100%}#paym button{flex:1;padding:9px 4px}
</style>
</head>
<body>
<header>
  <input id="store" aria-label="Nama toko" placeholder="Nama toko">
  <nav role="tablist">
    <button role="tab" data-t="kasir" aria-selected="true">Kasir</button>
    <button role="tab" data-t="produk" data-owner aria-selected="false">Produk</button>
    <button role="tab" data-t="riwayat" aria-selected="false">Riwayat</button>
    <button role="tab" data-t="member" aria-selected="false">Member</button>
    <button role="tab" data-t="laporan" data-owner aria-selected="false">Laporan</button>
  </nav>
  <button class="lkb" id="lockbtn" hidden>Kunci</button>
</header>

<main style="display:none" id="app">
<section class="view on" id="v-kasir">
  <div class="pos">
    <div class="box">
      <input class="search" id="q" placeholder="Cari nama atau kode barang" aria-label="Cari produk">
      <div class="grid" id="grid"></div>
    </div>
    <div class="box">
      <h2>Pesanan</h2>
      <div id="cart"></div>
      <div class="row"><span>Subtotal</span><b id="sub">Rp0</b></div>
      <div class="row"><label for="disc">Diskon (Rp)</label><input id="disc" inputmode="numeric" placeholder="0"></div>
      <div class="row total"><span>Total</span><span id="tot">Rp0</span></div>
      <div id="mbox" style="margin:6px 0">
        <input class="search" id="mq" placeholder="Cari member" aria-label="Cari member" autocomplete="off" style="margin-bottom:4px">
        <div id="msug"></div>
        <div id="mchip" hidden></div>
      </div>
      <div class="seg" id="paym" role="group">
        <button data-m="Tunai" aria-pressed="true">Tunai</button>
        <button data-m="QRIS" aria-pressed="false">QRIS</button>
        <button data-m="Transfer" aria-pressed="false">Transfer</button>
      </div>
      <div class="row" id="cashrow"><label for="cash">Uang diterima</label><input id="cash" inputmode="numeric" placeholder="Pas"></div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn full" id="pay">Bayar</button>
      <button class="btn ghost full" id="clr">Kosongkan</button>
    </div>
  </div>
</section>

<section class="view" id="v-produk">
  <div class="box">
    <h2>Tambah produk</h2>
    <div class="form">
      <input id="pc" placeholder="Kode barang">
      <input id="pn" placeholder="Nama produk">
      <input id="pm" inputmode="numeric" placeholder="Harga modal (Rp)">
      <input id="pp" inputmode="numeric" placeholder="Harga jual (Rp)">
      <button class="btn" id="padd">Simpan</button>
    </div>
    <div class="err" id="pmsg"></div>
    <h2>Daftar produk</h2>
    <div id="plist"></div>
  </div>
</section>

<section class="view" id="v-riwayat">
  <div class="box">
    <h2>Riwayat transaksi</h2>
    <div id="hist"></div>
  </div>
</section>

<section class="view" id="v-member">
  <div class="box">
    <h2>Tambah member</h2>
    <div class="form">
      <input id="mn" maxlength="40" placeholder="Nama member">
      <input id="mp" inputmode="tel" placeholder="No. telp (08xxx)">
    </div>
    <div class="form">
      <button class="btn" id="msave">Simpan member</button>
    </div>
    <div class="err" id="merr"></div>
    <h2>Daftar member</h2>
    <input class="search" id="mq2" placeholder="Cari member">
    <div id="mlist"></div>
  </div>
</section>

<section class="view" id="v-laporan">
  <div class="box">
    <div class="form">
      <label for="rd" style="align-self:center">Tanggal</label>
      <input type="date" id="rd" style="flex:0 0 auto">
      <button class="btn ghost" id="rtoday">Hari ini</button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</section>
</main>

<div id="lock" role="dialog" aria-modal="true" aria-labelledby="lt">
  <div class="lk">
    <h1 id="lt">Alkaff Fragrances</h1>
    <p id="lmsg">Masukkan PIN untuk membuka kasir</p>
    <input id="pin" type="password" inputmode="numeric" maxlength="12" autocomplete="off" aria-label="PIN">
    <div class="err" id="lerr"></div>
    <button class="btn full" id="lgo">Buka</button>
  </div>
</div>

<dialog id="dlg">
  <h2>Struk</h2>
  <pre id="rc"></pre>
  <label for="ph">Nomor WhatsApp (opsional)</label>
  <input class="phone" id="ph" inputmode="tel" placeholder="08xxx">
  <a class="btn wa full" id="wa" target="_blank" rel="noopener">Kirim via WhatsApp</a>
  <button class="btn ghost full" id="copy">Salin</button>
  <button class="btn full" id="done">Selesai</button>
</dialog>

<script>
window.app = {
  $: (s) => document.querySelector(s),
  safe: (v, f = "") => (v === null || v === undefined ? f : String(v).trim()),
  num: (v) => parseInt(String(v||0).replace(/\D/g,""), 10) || 0,
  rp: (n) => "Rp" + Math.round(n).toLocaleString("id-ID"),
  esc: (s) => window.app.safe(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c])),
  
  S: {
    store: "Alkaff Fragrances",
    products: [
      { id:1, name:"Parfum A", price:1200000, cost:850000, code:"P001", stock:0 },
      { id:2, name:"Parfum B", price:650000, cost:400000, code:"P002", stock:0 },
      { id:3, name:"Parfum C", price:100000, cost:60000, code:"P003", stock:0 }
    ],
    history: [],
    members: [],
    seq: 1,
    pid: 7
  },
  
  cart: {},
  curMember: null,
  payM: "Tunai",
  role: null,
  me: "",
  lock: { salt:"", owner:"", cashiers:[{name:"Kasir 1", pin:""},{name:"Kasir 2", pin:""}] },
  
  init() {
    try { this.S = Object.assign(this.S, JSON.parse(localStorage.getItem("kasir-v1") || "{}")); } catch(e) {}
    try { this.lock = Object.assign(this.lock, JSON.parse(localStorage.getItem("kasir-sec") || "{}")); } catch(e) {}
    this.showLock();
    this.setupEvents();
    this.renderGrid();
  },
  
  save() { try { localStorage.setItem("kasir-v1", JSON.stringify(this.S)); } catch(e) {} },
  saveLock() { try { localStorage.setItem("kasir-sec", JSON.stringify(this.lock)); } catch(e) {} },
  
  async hash(pin) {
    const txt = this.lock.salt + ":" + pin;
    try {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
      return Array.from(new Uint8Array(buf)).map(v => v.toString(16).padStart(2,"0")).join("");
    } catch(e) {
      return "error";
    }
  },
  
  showLock() {
    this.$("#lock").hidden = false;
    this.$("#app").style.display = "none";
    this.$("main").inert = true;
    this.$("header").inert = true;
    this.$("#pin").value = "";
    this.$("#lerr").textContent = "";
    this.$("#pin").focus();
  },
  
  async login() {
    const pin = this.$("#pin").value.trim();
    if (!/^\d{4,12}$/.test(pin)) { this.$("#lerr").textContent = "PIN 4-12 angka"; return; }
    
    if (!this.lock.owner) {
      this.lock.salt = Math.random().toString(36).slice(2);
      this.lock.owner = await this.hash(pin);
      this.saveLock();
      this.enter("owner");
      return;
    }
    
    const h = await this.hash(pin);
    if (h === this.lock.owner) {
      this.enter("owner");
      return;
    }
    
    this.$("#lerr").textContent = "PIN salah";
    this.$("#pin").value = "";
  },
  
  enter(role, name = "") {
    this.role = role;
    this.me = role === "owner" ? "Pemilik" : name;
    this.$("#lock").hidden = true;
    this.$("#app").style.display = "block";
    this.$("main").inert = false;
    this.$("header").inert = false;
    this.renderGrid();
  },
  
  setupEvents() {
    this.$("#pin").addEventListener("keypress", (e) => { if (e.key === "Enter") this.login(); });
    this.$("#lgo").addEventListener("click", () => this.login());
    this.$("#lockbtn").addEventListener("click", () => this.showLock());
    this.$("nav").addEventListener("click", (e) => {
      const b = e.target.closest("button[role='tab']");
      if (!b) return;
      document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b ? "true" : "false"));
      document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + b.dataset.t));
    });
    
    this.$("#store").addEventListener("change", () => { this.S.store = this.$("#store").value; this.save(); });
    this.$("#q").addEventListener("input", () => this.renderGrid());
    this.$("#grid").addEventListener("click", (e) => { const b = e.target.closest(".item"); if (b) { this.cart[b.dataset.id] = (this.cart[b.dataset.id]||0) + 1; this.renderCart(); } });
    this.$("#disc").addEventListener("input", () => this.renderCart());
    this.$("#pay").addEventListener("click", () => this.pay());
    this.$("#clr").addEventListener("click", () => { this.cart = {}; this.renderCart(); });
    this.$("#paym").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) this.payM = b.dataset.m; this.renderCart(); });
    
    this.$("#padd").addEventListener("click", () => this.addProd());
    this.$("#pn").addEventListener("keypress", (e) => { if (e.key === "Enter") this.addProd(); });
    
    this.$("#msave").addEventListener("click", () => this.addMember());
    this.$("#mq").addEventListener("input", () => this.suggestMember());
    this.$("#mq2").addEventListener("input", () => this.renderMem());
    
    this.$("#hist").addEventListener("click", (e) => { const b = e.target.closest("[data-re]"); if (b) this.showReceipt(b.dataset.re); });
    this.$("#ph").addEventListener("change", () => this.updateWA());
    this.$("#copy").addEventListener("click", () => navigator.clipboard.writeText(this.$("#rc").textContent));
    this.$("#done").addEventListener("click", () => { this.$("#dlg").close(); this.renderGrid(); });
    
    this.$("#rd").value = new Date().toISOString().split("T")[0];
    this.$("#rd").addEventListener("change", () => this.renderReport());
    this.$("#rtoday").addEventListener("click", () => { this.$("#rd").value = new Date().toISOString().split("T")[0]; this.renderReport(); });
  },
  
  renderGrid() {
    const q = this.$("#q").value.toLowerCase();
    let h = "";
    this.S.products.filter(p => window.app.safe(p.name).toLowerCase().includes(q) || window.app.safe(p.code).toLowerCase().includes(q)).forEach(p => {
      h += '<button class="item" data-id="' + p.id + '"><b>' + this.esc(p.name) + '</b><span>' + this.esc(p.code) + ' · ' + this.rp(p.price) + '</span><span>Stok ' + (p.stock||0) + '</span></button>';
    });
    this.$("#grid").innerHTML = h || '<div class="empty">Tidak ada produk</div>';
  },
  
  renderCart() {
    let h = "", sub = 0;
    this.S.products.forEach(p => {
      const qty = this.cart[p.id] || 0;
      if (!qty) return;
      sub += p.price * qty;
      h += '<div class="line"><div class="n">' + this.esc(p.name) + '<small>' + this.rp(p.price) + ' x ' + qty + '</small></div><div class="q"><button data-m="' + p.id + '">-</button><b>' + qty + '</b><button data-p="' + p.id + '">+</button></div></div>';
    });
    this.$("#cart").innerHTML = h || '<div class="empty">Pesanan kosong</div>';
    this.$("#cart").addEventListener("click", (e) => {
      const m = e.target.closest("[data-m]"); if (m) { this.cart[m.dataset.m]--; if (this.cart[m.dataset.m] <= 0) delete this.cart[m.dataset.m]; this.renderCart(); }
      const p = e.target.closest("[data-p]"); if (p) { this.cart[p.dataset.p] = (this.cart[p.dataset.p]||0) + 1; this.renderCart(); }
    });
    const disc = Math.min(this.num(this.$("#disc").value), sub);
    this.$("#sub").textContent = this.rp(sub);
    this.$("#tot").textContent = this.rp(sub - disc);
  },
  
  pay() {
    if (!Object.keys(this.cart).length) { this.$("#err").textContent = "Pesanan kosong"; return; }
    const sub = Object.keys(this.cart).reduce((a, id) => a + (this.S.products.find(p => String(p.id) === id)?.price || 0) * (this.cart[id]||0), 0);
    const disc = Math.min(this.num(this.$("#disc").value), sub);
    const total = sub - disc;
    const cash = this.payM === "Tunai" ? this.num(this.$("#cash").value) : total;
    if (cash < total) { this.$("#err").textContent = "Uang kurang " + this.rp(total - cash); return; }
    
    const items = Object.keys(this.cart).map(id => { const p = this.S.products.find(x => String(x.id) === id); return { id, name: p.name, qty: this.cart[id], price: p.price }; });
    const tx = {
      no: "INV-" + String(this.S.seq++).padStart(4,"0"),
      store: this.S.store,
      kasir: this.me,
      date: new Date().toLocaleString("id-ID", {dateStyle:"medium", timeStyle:"short"}),
      items, sub, disc, total, cash,
      phone: this.curMember?.phone || ""
    };
    this.S.history.push(tx);
    this.save();
    items.forEach(i => { const p = this.S.products.find(x => String(x.id) === String(i.id)); if (p) p.stock = (p.stock||0) - i.qty; });
    this.cart = {}; this.$("#err").textContent = "";
    this.showReceipt(tx.no);
    this.renderCart();
    this.renderHist();
  },
  
  showReceipt(no) {
    const t = this.S.history.find(x => x.no === no);
    if (!t) return;
    const lines = ["*" + t.store.toUpperCase() + "*", t.no, t.date, "---------"];
    t.items.forEach(i => { lines.push(i.qty + "x " + i.name); lines.push("   @" + this.rp(i.price) + " = " + this.rp(i.qty * i.price)); });
    lines.push("---------", "Subtotal: " + this.rp(t.sub));
    if (t.disc) lines.push("Diskon: -" + this.rp(t.disc));
    lines.push("*Total: " + this.rp(t.total) + "*", "");
    this.$("#rc").textContent = lines.join("\n");
    this.$("#ph").value = t.phone || "";
    this.updateWA();
    if (!this.$("#dlg").open) this.$("#dlg").showModal();
  },
  
  updateWA() {
    const ph = String(this.$("#ph").value).replace(/\D/g, "");
    let wa = ph;
    if (ph.indexOf("0") === 0) wa = "62" + ph.slice(1);
    const a = this.$("#wa");
    if (wa.length >= 10 && wa.length <= 15) {
      a.href = "https://wa.me/" + wa + "?text=" + encodeURIComponent(this.$("#rc").textContent);
    }
  },
  
  renderHist() {
    let h = "";
    this.S.history.slice().reverse().forEach(t => {
      h += '<div class="line"><div class="n"><b>' + t.no + '</b><small>' + t.date + '</small></div><b>' + this.rp(t.total) + '</b><button class="btn ghost" data-re="' + t.no + '">Buka</button></div>';
    });
    this.$("#hist").innerHTML = h || '<div class="empty">Belum ada transaksi</div>';
  },
  
  addProd() {
    const name = this.$("#pn").value.trim();
    const price = this.num(this.$("#pp").value);
    if (!name || !price) { this.$("#pmsg").textContent = "Isi nama dan harga"; return; }
    this.S.products.push({ id: this.S.pid++, code: this.$("#pc").value.trim() || "P" + this.S.pid, name, price, cost: this.num(this.$("#pm").value), stock:0 });
    this.save();
    this.$("#pn").value = ""; this.$("#pp").value = ""; this.$("#pm").value = ""; this.$("#pc").value = ""; this.$("#pmsg").textContent = "";
    this.renderGrid(); this.renderProd();
  },
  
  renderProd() {
    let h = "";
    this.S.products.forEach(p => {
      h += '<div class="line"><div class="n">' + this.esc(p.name) + '<small>Kode ' + this.esc(p.code) + ' · Jual ' + this.rp(p.price) + '</small></div><button class="x" data-del="' + p.id + '">Hapus</button></div>';
    });
    this.$("#plist").innerHTML = h || '<div class="empty">Belum ada produk</div>';
    this.$("#plist").addEventListener("click", (e) => { const b = e.target.closest("[data-del]"); if (b) { this.S.products = this.S.products.filter(p => String(p.id) !== b.dataset.del); this.save(); this.renderGrid(); this.renderProd(); } });
  },
  
  addMember() {
    const nm = this.$("#mn").value.trim();
    const ph = String(this.$("#mp").value).replace(/\D/g, "");
    if (!nm || !ph) { this.$("#merr").textContent = "Isi nama dan nomor"; return; }
    this.S.members.push({ phone: ph, name: nm });
    this.save();
    this.$("#mn").value = ""; this.$("#mp").value = ""; this.$("#merr").textContent = "";
    this.renderMem();
  },
  
  renderMem() {
    const q = this.$("#mq2").value.toLowerCase();
    const list = this.S.members.filter(m => m.name.toLowerCase().includes(q) || m.phone.includes(q));
    this.$("#mlist").innerHTML = list.length ? list.map(m => '<div class="line"><div class="n"><b>' + this.esc(m.name) + '</b><small>' + m.phone + '</small></div></div>').join("") : '<div class="empty">Belum ada member</div>';
  },
  
  suggestMember() {
    const q = this.$("#mq").value.toLowerCase();
    if (!q) { this.$("#msug").innerHTML = ""; return; }
    const list = this.S.members.filter(m => m.name.toLowerCase().includes(q)).slice(0, 5);
    this.$("#msug").innerHTML = list.map(m => '<div class="line" data-pick="' + m.phone + '"><div class="n"><b>' + this.esc(m.name) + '</b><small>' + m.phone + '</small></div></div>').join("");
    this.$("#msug").addEventListener("click", (e) => { const b = e.target.closest("[data-pick]"); if (b) { const m = this.S.members.find(x => x.phone === b.dataset.pick); if (m) { this.curMember = m; this.$("#mchip").innerHTML = '<div class="line"><div class="n"><b>' + this.esc(m.name) + '</b></div><button class="x" id="mrm">X</button></div>'; this.$("#mchip").hidden = false; this.$("#mq").value = ""; this.$$("#msug").innerHTML = ""; this.$("#mq").hidden = true; } } });
  },
  
  renderReport() {
    const d = this.$("#rd").value;
    let total = 0, count = 0;
    this.S.history.forEach(t => { if (t.date.includes(d)) { total += t.total; count++; } });
    this.$("#stats").innerHTML = '<div class="stat"><span>Total penjualan</span><b>' + this.rp(total) + '</b></div><div class="stat"><span>Transaksi</span><b>' + count + '</b></div>';
  }
};

window.app.init();
</script>
</body>
</html>
